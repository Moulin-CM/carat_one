buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Global configuration to force all subprojects (plugins) to use the same stable SDK versions
    def configureAndroidProject = { p ->
        if (p.hasProperty('android')) {
            p.android {
                compileSdk 35
                defaultConfig {
                    minSdkVersion 23
                    targetSdkVersion 35
                }
            }
        }
    }

    if (project.state.executed) {
        configureAndroidProject(project)
    } else {
        project.afterEvaluate {
            configureAndroidProject(it)
        }
    }

    // Prevent circular dependency by only applying to other subprojects
    /*if (project.name != 'app') {
        project.evaluationDependsOn(':app')
    }*/
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
