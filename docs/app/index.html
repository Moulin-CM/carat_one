<!DOCTYPE html>
<html>
<head>

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder used by the Flutter tool.
    If you run `flutter run` or `flutter build web`, this placeholder will be
    replaced automatically.
  -->
  <base href="/carat_one/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CaratOne - Diamond Trading App">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CaratOne">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CaratOne</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1a2e; }
    #caratone-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 2147483647;
      transition: opacity 0.25s ease-out;
    }
    #caratone-loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-left-color: #4F8AF4;
      border-radius: 50%;
      animation: caratone-spin 0.9s linear infinite;
    }
    #caratone-loading .label {
      margin-top: 18px;
      font-size: 14px;
      letter-spacing: 0.3px;
      opacity: 0.75;
    }
    @keyframes caratone-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="caratone-loading">
    <div class="spinner"></div>
    <div class="label">Loading CaratOne&hellip;</div>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // Safety net for the classic "Flutter web on a redeploy" bug:
    // the browser caches index.html / flutter_service_worker.js, then after
    // a redeploy the cached service worker tries to fetch chunks that no
    // longer exist and the app silently hangs on a blank page. Opening
    // DevTools (with "Disable cache" enabled) sidesteps this — hence the
    // "works only with inspect open" symptom on desktop.
    //
    // If the engine fails to render within the timeout, we wipe every
    // cache + unregister the service worker, then reload once.
    // ──────────────────────────────────────────────────────────────────────
    window.caratoneAppRendered = false;
    var caratoneFallbackFired = false;

    function caratoneRemoveSpinner() {
      var loading = document.getElementById('caratone-loading');
      if (!loading) return;
      loading.style.opacity = '0';
      setTimeout(function () { loading.remove(); }, 260);
    }
    window.caratoneRemoveSpinner = caratoneRemoveSpinner;

    function caratoneClearCachesAndReload() {
      if (caratoneFallbackFired) return;
      caratoneFallbackFired = true;

      var done = function () {
        // Guard against an endless reload loop on persistent failure.
        if (sessionStorage.getItem('caratoneReloaded') === '1') return;
        sessionStorage.setItem('caratoneReloaded', '1');
        window.location.reload();
      };

      var swPromise = ('serviceWorker' in navigator)
        ? navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .catch(function () { /* ignore */ })
        : Promise.resolve();

      var cachePromise = ('caches' in window)
        ? caches.keys()
            .then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            })
            .catch(function () { /* ignore */ })
        : Promise.resolve();

      Promise.all([swPromise, cachePromise]).then(done, done);
    }
    window.caratoneClearCachesAndReload = caratoneClearCachesAndReload;

    // 12s is generous for cold loads on slow networks but short enough that
    // users on a broken cache don't sit staring at the spinner.
    setTimeout(function () {
      if (window.caratoneAppRendered) return;
      console.warn('CaratOne: app did not render in time — clearing caches and retrying.');
      caratoneClearCachesAndReload();
    }, 12000);

    // When a new service worker takes control mid-load, reload so the page
    // is served by the fresh worker and references valid chunks.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (window.caratoneAppRendered) return;
        window.location.reload();
      });
    }

    // Detect when Flutter has actually painted the first frame and hide
    // the loading overlay. The framework dispatches `flutter-first-frame`
    // on `window` once the engine renders.
    window.addEventListener('flutter-first-frame', function () {
      window.caratoneAppRendered = true;
      sessionStorage.removeItem('caratoneReloaded');
      caratoneRemoveSpinner();
    });
  </script>

  <!--
    Modern Flutter web bootstrap (Flutter 3.22+). The tool generates
    flutter_bootstrap.js automatically on `flutter run` / `flutter build web`
    and it handles engine initialization, the service worker, and renderer
    selection. Replaces the deprecated `flutter.js` + `loadEntrypoint` flow
    that silently fails on newer Flutter SDKs.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
