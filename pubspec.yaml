name: invoice_generator
description: Cross-platform invoice generator matching exact template format
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.10.7
  printing: ^5.12.0
  intl: ^0.19.0
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  cross_file: ^0.3.3
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  package_info_plus: ^8.0.2

    # Firebase
  firebase_core: ^3.6.0
  firebase_database: ^11.1.0
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  android_icon: "assets/icon/app_icon.png"
  android_adaptive_icon_background: "#1a1a2e"
  android_adaptive_icon_foreground: "assets/icon/app_icon.png"

